  </defs>

  <!-- cielo -->
  <rect width="1600" height="1000" fill="url(#cielo)"/>

  <!-- sol -->
  <circle cx="1130" cy="330" r="150" fill="#D4A574"/>
  <circle cx="1130" cy="330" r="190" fill="none" stroke="#D4A574" stroke-opacity="0.35" stroke-width="3"/>

  <!-- gaviotas -->
  <g fill="none" stroke="#3F312A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
