<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Ilustración: un crucero navega frente al sol">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3ED"/>
      <stop offset="1" stop-color="#EEDFC8"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A574"/>
      <stop offset="1" stop-color="#B8894F"/>
