    <path d="M500 262 q16 -18 32 0 q16 -18 32 0"/>
    <path d="M330 262 q12 -14 24 0 q12 -14 24 0"/>
  </g>

  <!-- mar -->
  <rect x="0" y="640" width="1600" height="360" fill="url(#mar)"/>

