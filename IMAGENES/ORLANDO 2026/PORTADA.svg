    <line x1="430" y1="488" x2="1070" y2="488" stroke-width="12" stroke-dasharray="16 18"/>
    <line x1="500" y1="447" x2="960" y2="447" stroke-width="12" stroke-dasharray="16 18"/>
    <line x1="540" y1="404" x2="692" y2="404" stroke-width="10" stroke-dasharray="22 12"/>
    <line x1="340" y1="600" x2="1210" y2="600" stroke-width="8" stroke-dasharray="8 26"/>
